name: Monitor U2 Dates

on:
  schedule:
    # Executa automaticamente a cada 30 minutos
    - cron: '*/30 * * * *'
  # Botão para disparo manual a qualquer momento
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar script de monitoramento
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
        run: |
          python monitor_u2.py

      - name: Atualizar estado no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f u2_tour_state.json ]; then
            git add u2_tour_state.json
            git diff --staged --quiet || (git commit -m "chore: atualiza base de dados do monitor [skip ci]" && git push)
          fi
